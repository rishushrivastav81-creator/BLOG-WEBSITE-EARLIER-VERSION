version: '3.8'

services:
  # Caddy Reverse Proxy & Static Caching Layer
  caddy:
    image: caddy:2.7-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - web

  # Web Frontend Applet
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - APP_URL=http://localhost:3000

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=meridian_user
      - POSTGRES_PASSWORD=meridian_dev_password
      - POSTGRES_DB=meridian_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # PgBouncer Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      - DB_USER=meridian_user
      - DB_PASSWORD=meridian_dev_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
    ports:
      - "6432:6432"
    depends_on:
      - postgres

  # Redis Distributed Cache & Quotas
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  caddy_data:
  pgdata:
  redisdata:
